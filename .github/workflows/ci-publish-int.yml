name: CI and NuGet Test Publish

on:
  push:
    branches:
      - master
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - master

jobs:
  build_and_test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build

  publish_nuget_int:
    name: Publish to int.nugettest.org (Trusted Publishing)
    runs-on: ubuntu-latest
    needs: build_and_test
    if: startsWith(github.ref, 'refs/tags/v')  # only with tags like v0.1.0

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Validate tag + set VERSION
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "Tag: $TAG"

          # must be exactly v<major>.<minor>.<patch>
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Tag must match vMAJOR.MINOR.PATCH (e.g. v1.2.3). Got: $TAG"
            exit 1
          fi

          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Validated version: $VERSION"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Pack (version from git tag)
        shell: bash
        run: |
          echo "Packing version: $VERSION"
          dotnet pack ./src/Result.Core/Result.Core.csproj \
            -c Release \
            -o ./artifacts \
            --no-build \
            /p:Version="$VERSION"

      - name: Verify exactly one .nupkg (no multiple packages)
        shell: bash
        run: |
          shopt -s nullglob
          files=(artifacts/*.nupkg)

          if (( ${#files[@]} != 1 )); then
            echo "ERROR: Expected exactly 1 .nupkg in artifacts/, found ${#files[@]}:"
            if (( ${#files[@]} == 0 )); then
              echo " - <none>"
            else
              printf ' - %s\n' "${files[@]}"
            fi
            exit 1
          fi

          echo "OK: Found exactly one package: ${files[0]}"
          echo "PACKAGE_PATH=${files[0]}" >> "$GITHUB_ENV"

      - name: NuGet login (int.nugettest.org)
        uses: NuGet/login@v1
        id: login
        with:
          token-service-url: https://int.nugettest.org/api/v2/token
          audience: https://int.nugettest.org
          user: nebu1212

      - name: Push package to int.nugettest.org (skip duplicates)
        shell: bash
        run: |
          dotnet nuget push "$PACKAGE_PATH" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source "https://apiint.nugettest.org/v3/index.json" \
            --skip-duplicate
