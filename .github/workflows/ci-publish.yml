name: CI and NuGet Publish (int + prod)

on:
  push:
    branches:
      - master
    tags:
      - "v*.*.*"
      - "publish/v*.*.*"
  pull_request:
    branches:
      - master

jobs:
  build_and_test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build


  publish_int:
    name: Publish to int.nugettest.org
    runs-on: ubuntu-latest
    needs: build_and_test
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Validate tag + set VERSION
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"   # e.g. v1.2.3
          echo "Tag: $TAG"

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Tag must match vMAJOR.MINOR.PATCH (e.g. v1.2.3). Got: $TAG"
            exit 1
          fi

          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Validated version: $VERSION"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Pack (version from git tag)
        shell: bash
        run: |
          dotnet pack ./src/Result.Core/Result.Core.csproj \
            -c Release \
            -o ./artifacts \
            --no-build \
            /p:Version="$VERSION"

      - name: Verify exactly one .nupkg
        shell: bash
        run: |
          shopt -s nullglob
          files=(artifacts/*.nupkg)

          if (( ${#files[@]} != 1 )); then
            echo "ERROR: Expected exactly 1 .nupkg, found ${#files[@]}:"
            printf ' - %s\n' "${files[@]:-<none>}"
            exit 1
          fi

          echo "PACKAGE_PATH=${files[0]}" >> "$GITHUB_ENV"
          echo "OK: ${files[0]}"

      - name: NuGet login (int.nugettest.org)
        uses: NuGet/login@v1
        id: login
        with:
          token-service-url: https://int.nugettest.org/api/v2/token
          audience: https://int.nugettest.org
          user: nebu1212

      - name: Push to int.nugettest.org (skip duplicates)
        run: |
          dotnet nuget push "$PACKAGE_PATH" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source "https://apiint.nugettest.org/v3/index.json" \
            --skip-duplicate


  publish_prod:
    name: Publish to nuget.org (promotion)
    runs-on: ubuntu-latest
    needs: build_and_test
    if: startsWith(github.ref, 'refs/tags/publish/v')

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Validate publish tag + set VERSION
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"   # e.g. publish/v1.2.3
          echo "Tag: $TAG"

          if [[ ! "$TAG" =~ ^publish\/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Tag must match publish/vMAJOR.MINOR.PATCH (e.g. publish/v1.2.3). Got: $TAG"
            exit 1
          fi

          VERSION="${TAG#publish/v}"
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Validated version: $VERSION"

      # --- Proof: version must exist on int feed ---
      - name: Verify version exists on int feed
        shell: bash
        run: |
          dotnet new classlib -n _tmp -o _tmp >/dev/null
          cd _tmp

          cat > NuGet.config <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="nugettest-int" value="https://apiint.nugettest.org/v3/index.json" />
            </packageSources>
          </configuration>
          EOF

          if dotnet add package Result.Core --version "$VERSION" >/dev/null; then
            echo "OK: Result.Core $VERSION exists on int feed."
          else
            echo "ERROR: Result.Core $VERSION NOT found on int feed. Publish to int first (tag v$VERSION)."
            exit 1
          fi

      # --- Re-pack (or keep: pack again ensures same bits from this tag commit) ---
      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Pack (version from publish tag)
        shell: bash
        run: |
          dotnet pack ./src/Result.Core/Result.Core.csproj \
            -c Release \
            -o ./artifacts \
            --no-build \
            /p:Version="$VERSION"

      - name: Verify exactly one .nupkg
        shell: bash
        run: |
          shopt -s nullglob
          files=(artifacts/*.nupkg)

          if (( ${#files[@]} != 1 )); then
            echo "ERROR: Expected exactly 1 .nupkg, found ${#files[@]}:"
            printf ' - %s\n' "${files[@]:-<none>}"
            exit 1
          fi

          echo "PACKAGE_PATH=${files[0]}" >> "$GITHUB_ENV"
          echo "OK: ${files[0]}"

      - name: NuGet login (nuget.org)
        uses: NuGet/login@v1
        id: login
        with:
          user: nebu1212

      - name: Push to nuget.org (skip duplicates)
        run: |
          dotnet nuget push "$PACKAGE_PATH" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate